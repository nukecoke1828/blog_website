<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作 · NukeCoke's Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{template "nav.html" .}}

    <div class="container">
        <h1 style="font-size:1.4rem; font-weight:650; margin-bottom:22px; color:var(--text);">写文章</h1>

        <div class="card">
            <form action="/blog/create" method="post">
                {{ .csrfField }}
                <div class="form-group">
                    <label class="form-label" for="title">标题</label>
                    <input class="form-input" type="text" id="title" name="title" placeholder="起个好标题..." required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="content">正文</label>
                    <textarea class="form-textarea" id="content" name="content" rows="12" placeholder="写下你的想法..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="tags">标签 <span style="font-weight:400;color:var(--text-muted);">（可选，逗号分隔）</span></label>
                    <input class="form-input" type="text" id="tags" name="tags" placeholder="技术, 生活, 笔记">
                </div>
                <div style="text-align:right;">
                    <button type="submit" class="btn btn-primary">发布</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
