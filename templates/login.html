<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · NukeCoke's Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div style="text-align:center; margin-bottom:8px;">
                <div style="width:48px; height:48px; border-radius:50%; margin:0 auto 12px;
                    background: linear-gradient(135deg, var(--teal-200), var(--teal-400));
                    display:flex; align-items:center; justify-content:center;
                    color:#fff; font-size:1.2rem; box-shadow: 0 4px 16px rgba(45,212,191,.18);
                ">·</div>
            </div>
            <h2 class="login-title">欢迎</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input class="form-input" type="text" id="username" name="username" placeholder="输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-input" type="password" id="password" name="password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">登录</button>
            </form>
            <p class="form-sub">新用户将自动注册</p>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
