<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} · NukeCoke's Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{template "nav.html" .}}

    <div class="container">
        <div class="profile-spot">
            <div class="avatar-circle">·</div>
            <div class="name">{{ .name }}</div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="label">学校</div>
                <div class="value">{{ .school }}</div>
            </div>
            <div class="info-card">
                <div class="label">家乡</div>
                <div class="value">{{ .hometown }}</div>
            </div>
            <div class="info-card">
                <div class="label">爱好</div>
                <div class="tags-row">
                    {{ range .hobbies }}<span class="tag">{{ . }}</span>{{ end }}
                </div>
            </div>
            <div class="info-card" style="grid-column:1/-1;">
                <div class="label">简介</div>
                <div class="value">{{ .introduction }}</div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
